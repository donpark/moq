name: Release tag

# Dart, C, and C++ publish from a tag rather than on a push to `release`. This
# pushes each such tag a version on `release` lacks, so a version a human set
# there publishes once it lands; it never picks or writes a version. C and C++
# tags wait for the moq-ffi release their pin names. See sh/gh/versions.py.
permissions:
  contents: read

on:
  # Every push, not only those touching a package: a C or C++ tag waiting on
  # its pinned moq-ffi release retries on the next one.
  push:
    branches: [release]
  # Retrying a tag by hand. Dispatch it on `release`; the job refuses any other
  # ref.
  workflow_dispatch:

# Each run tags the pushed `release`, so a newer push makes an in-flight run
# moot.
concurrency:
  group: release-tag
  cancel-in-progress: true

jobs:
  tag:
    name: Tag
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'moq-dev' && github.ref == 'refs/heads/release' }}

    steps:
      # The app's token, as release-plz uses, so the tags it pushes run their
      # release workflows.
      - name: Generate GitHub token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: generate-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - uses: ./.github/actions/just

      - name: Push release tags
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: just gh versions tag
