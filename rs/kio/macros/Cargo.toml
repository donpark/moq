# The `#[kio::test]` attribute. A separate crate only because a proc macro
# must be; `kio` re-exports it behind its `sim` feature.
[package]
name = "kio-macros"
description = "The #[kio::test] attribute; use it through kio's sim feature."
authors = ["Luke Curley"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.1.0"
edition = "2024"
rust-version.workspace = true

keywords = ["async", "test", "simulation"]
categories = ["development-tools::testing"]

[lib]
proc-macro = true

[lints]
workspace = true
